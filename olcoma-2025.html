<script type="application/json" id="data">{"I": [{"answer": "c", "text": "Dana, de 10 años, está jugando con el número 10. Para ello, tiene de una caja que contiene 10 bolas blancas, 10 rojas y 10 azules. Cada color de bola produce un efecto especial: Las bolas blancas suman 1 unidad. Las bolas rojas restan 2 unidades. Las bolas azules suman 3 unidades. El juego consiste en extraer tres bolas de la caja. Se comienza con el número 10 y se aplica el efecto de la primera bola extraída. Luego, al resultado obtenido, se le aplica el efecto de la segunda bola, y finalmente, al nuevo resultado, se le aplica el efecto de la tercera bola. Por ejemplo, si Dana extrae tres bolas blancas, sumará 1 unidad tres veces al 10 inicial, obteniendo un total de 13. Si Dana extrae tres bolas y al menos una es azul, ¿cuál es el valor mínimo que puede obtener al aplicar los efectos de las tres bolas?", "choices": ["−6", "4", "9", "13"], "figure": ""}, {"answer": "46", "text": "En una clase de matemática se escriben en la pizarra los números del 1 al 10. Luego, cada estudiante participa en el siguiente juego: una persona borra dos números y escribe en la pizarra el resultado de sumar ambos números y restar 1. Luego pasa otra persona estudiante y hace lo mismo. El juego se repite hasta que queda un único número en la pizarra. ¿Cuál es ese número?", "choices": [], "figure": ""}, {"answer": "c", "text": "Dana, Nicole y Sofía han decidido comenzar un plan de ahorro. Cada una de ellas deposita diariamente una cantidad específica de dinero, pero estas cantidades difieren entre sí: <br>• Nicole ahorra una cierta cantidad fija cada día. <br>• Dana ahorra diariamente 5 dólares menos que Nicole. <br>• Sofía ahorra cada día el triple de lo que ahorra Nicole.<br><br>Las tres comenzaron a ahorrar el mismo día y han mantenido este hábito durante 7 días. Se sabe que, al cabo de este período, Dana ha acumulado un total de 84 dólares. ¿Cuánto ha ahorrado diariamente Sofía ?", "choices": ["12", "17", "51", "56"], "figure": ""}, {"answer": "b", "text": "En una misión interestelar, el androide Salomón-X debe activar una consola alienígena compuesta por 16 paneles de energía colocados en una cuadrícula de tamaño 4 × 4. Cada panel puede iluminarse en uno de cuatro colores: rojo (R), azul (A), verde (V) o morado (M). El sistema de seguridad de la nave exige que cada fila y cada columna contenga exactamente un panel de cada color para desbloquear el siguiente nivel de acceso. Después de programar la mayoría de los paneles, queda uno por configurar, marcado con un símbolo estelar ⋆. ¿Cuántos de los cuatro colores podrían programarse en el panel marcado con el símbolo ⋆sin violar las reglas del sistema?", "choices": ["1", "2", "3", "4"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 230 225\" width=\"230\" height=\"225\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><rect x=\"14\" y=\"12\" width=\"200\" height=\"200\" fill=\"none\"/><path d=\"M64 12v200 M14 62h200\" /><path d=\"M114 12v200 M14 112h200\" /><path d=\"M164 12v200 M14 162h200\" /><text x=\"34\" y=\"43\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">V<\/text><text x=\"135\" y=\"43\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">★<\/text><text x=\"32\" y=\"93\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">M<\/text><text x=\"84\" y=\"93\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">V<\/text><text x=\"84\" y=\"143\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"84\" y=\"193\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">R<\/text><\/g><\/svg>"}, {"answer": "840", "text": "Este año, en una maratón participaron más de 800 personas. Al seleccionar al azar a un participante, la probabilidad de que sea mujer es del 35 %. Si se sabe que hubo 252 hombres más que la cantidad de mujeres, ¿cuántas personas participaron en la maratón?", "choices": [], "figure": ""}, {"answer": "c", "text": "Se tiene una rueda giratoria dividida en 30 secciones del mismo tamaño, los números del 1 al 30 están distribuidos en estas regiones. Al girarla, la rueda se detiene al azar en una de las secciones. La probabilidad de que el número contenido en la región sea divisor de 30 corresponde a", "choices": ["<span class=\"fraction\"><span>1<\/span><span>2<\/span><\/span>", "<span class=\"fraction\"><span>3<\/span><span>10<\/span><\/span>", "<span class=\"fraction\"><span>4<\/span><span>15<\/span><\/span>", "<span class=\"fraction\"><span>1<\/span><span>6<\/span><\/span>"], "figure": ""}, {"answer": "115", "text": "Considere los segmentos PQ y QR. Sean S y T puntos en PQ y QR, y X es el punto de intersección de SR y PT, tal y como se muestra en la siguiente figura. Además, m∠PQR = 37°, m∠QPT = 43° y m∠SRQ = 35°. Determine m∠PXR en grados.", "choices": [], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 250 247\" width=\"250\" height=\"247\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M41 212L121 21L219 231 M41 212L177.84 142.8 M61 164.25L219 231\" /><circle cx=\"41\" cy=\"212\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"121\" cy=\"21\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"219\" cy=\"231\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"61\" cy=\"164.25\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"177.84\" cy=\"142.8\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"101.55\" cy=\"181.38\" r=\"2.3\" fill=\"#202936\"/><text x=\"24\" y=\"217\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">P<\/text><text x=\"115\" y=\"17\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">Q<\/text><text x=\"225\" y=\"235\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">R<\/text><text x=\"44\" y=\"165\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">S<\/text><text x=\"184\" y=\"144\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">T<\/text><text x=\"97.55\" y=\"173.38\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">X<\/text><\/g><\/svg>"}, {"answer": "d", "text": "Cierta cantidad de estudiantes se inscribió para participar en la Olimpiada de Matemática, que está compuesta por dos etapas. Se sabe que la prueba de la primera etapa la realizó el 85 % de quienes se inscribieron, y la segunda etapa la realizaron las dos terceras partes de quienes realizaron la primera, que fueron 272 estudiantes. Determine la cantidad de estudiantes que se inscribieron.", "choices": ["72", "213", "346", "480"], "figure": ""}, {"answer": "a", "text": "En la figura ABCD y AEGI son cuadrados. Si el área de ABCD es 49 cm² y el área del rectángulo EBCF es 91 cm². ¿Cuál es la diferencia en centímetros entre el perímetro del cuadrado AEGI y el perímetro del rectángulo HIAB?", "choices": ["26", "31", "54", "80"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 268 265\" width=\"268\" height=\"265\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"28\" width=\"207\" height=\"207\" fill=\"none\"/><path d=\"M102.45 28V235 M30 162.55H237\" /><text x=\"15\" y=\"23\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">E<\/text><text x=\"98\" y=\"23\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">F<\/text><text x=\"236\" y=\"23\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">G<\/text><text x=\"13\" y=\"175\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><text x=\"85\" y=\"175\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">C<\/text><text x=\"243\" y=\"175\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">H<\/text><text x=\"14\" y=\"251\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"96\" y=\"251\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">D<\/text><text x=\"241\" y=\"251\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">I<\/text><\/g><\/svg>"}, {"answer": "c", "text": "Un número es alegre si tiene cuatro dígitos y, al ser dividirlo por 2, 3, 5 y 7, se obtiene un residuo de 1. La suma de los dígitos del menor número alegre corresponde a:", "choices": ["5", "6", "7", "8"], "figure": ""}, {"answer": "d", "text": "El número N es el menor número de cuatro dígitos con exactamente tres divisores primos que es divisible por 75 y por 35. La suma de los dígitos de N corresponde a:", "choices": ["6", "12", "15", "18"], "figure": ""}, {"answer": "288", "text": "Una pared se forma utilizando bloques cuadrados y rectangulares, como se muestra en la figura. Las dimensiones de los bloques rectangulares son de 24 cm de largo y 16 cm de ancho. ¿Cuál es el perímetro de la pared?", "choices": [], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 335 204\" width=\"335\" height=\"204\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><rect x=\"56\" y=\"12\" width=\"96\" height=\"60\" fill=\"none\"/><rect x=\"164\" y=\"12\" width=\"60\" height=\"60\" fill=\"none\"/><rect x=\"224\" y=\"12\" width=\"96\" height=\"60\" fill=\"none\"/><rect x=\"47\" y=\"72\" width=\"60\" height=\"60\" fill=\"none\"/><rect x=\"107\" y=\"72\" width=\"60\" height=\"60\" fill=\"none\"/><rect x=\"167\" y=\"72\" width=\"96\" height=\"60\" fill=\"none\"/><rect x=\"8\" y=\"132\" width=\"96\" height=\"60\" fill=\"none\"/><rect x=\"104\" y=\"132\" width=\"96\" height=\"60\" fill=\"none\"/><rect x=\"200\" y=\"132\" width=\"60\" height=\"60\" fill=\"none\"/><\/g><\/svg>"}, {"answer": "10", "text": "Sea □ABCD un rombo. Sea E un punto, tal que B pertenece al segmento AE y 2BE = AB. Sea F el punto de intersección de las diagonales del rombo. El área de △AFD es 5 cm². Entonces el área del cuadrilátero □BFCE corresponde a:", "choices": [], "figure": ""}, {"answer": "114", "text": "Una hormiga recorre un trayecto desde el punto A hasta el punto B siguiendo la línea continua que se muestra en la figura adjunta. Los cuadriláteros que se forman con el trayecto de la hormiga y la línea punteada, son cuadrados. Si la distancia en línea recta desde A hasta B (la línea punteada) es de 38 cm, ¿cuál es la distancia total que recorre la hormiga?", "choices": [], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 426 165\" width=\"426\" height=\"165\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M25 100H401\" stroke-dasharray=\"6 5\" stroke=\"#1762a0\"/><path d=\"M25 100V150h50V75h25V130h30V50h50V150h50V25h75V133h33V37h63V100\" /><circle cx=\"25\" cy=\"100\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"401\" cy=\"100\" r=\"2.3\" fill=\"#202936\"/><text x=\"8\" y=\"105\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"407\" y=\"105\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><\/g><\/svg>"}, {"answer": "36", "text": "Olcoman ha aterrizado en el planeta Cúbiton, donde los habitantes locales han solicitado su ayuda para construir una estatua ceremonial cúbica de forma perfecta en honor a su planeta. Para este propósito, Olcoman cuenta con bloques modulares traídos desde la Tierra, cada uno con dimensiones exactas de 2×4×6 unidades. Por respeto a las tradiciones cúbitas, los bloques no pueden ser cortados ni modificados, y la estatua debe tener forma de cubo perfecto, sólido y sin huecos. ¿Cuál es la menor cantidad de bloques necesarios para construir esta estatua cúbica?", "choices": [], "figure": ""}, {"answer": "15", "text": "Olcoman escribió números en 5 de los 10 círculos como se muestra en la figura y quiere escribir números en el resto de los 5 círculos de tal manera que la suma de los 3 números en cada lado del pentágono sea la misma. ¿Cuál es el número que debe colocar en el círculo donde está la X?", "choices": [], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 276 255\" width=\"276\" height=\"255\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M138 26L248 104L207 231H69L28 104Z\" fill=\"#87bad7\"/><circle cx=\"138\" cy=\"26\" r=\"22\" fill=\"white\"/><circle cx=\"83\" cy=\"65\" r=\"22\" fill=\"white\"/><circle cx=\"28\" cy=\"104\" r=\"22\" fill=\"white\"/><circle cx=\"49\" cy=\"167\" r=\"22\" fill=\"white\"/><circle cx=\"69\" cy=\"231\" r=\"22\" fill=\"white\"/><circle cx=\"138\" cy=\"231\" r=\"22\" fill=\"white\"/><circle cx=\"207\" cy=\"231\" r=\"22\" fill=\"white\"/><circle cx=\"227\" cy=\"167\" r=\"22\" fill=\"white\"/><circle cx=\"248\" cy=\"104\" r=\"22\" fill=\"white\"/><circle cx=\"193\" cy=\"65\" r=\"22\" fill=\"white\"/><text x=\"133\" y=\"32\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">8<\/text><text x=\"78\" y=\"71\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">4<\/text><text x=\"44\" y=\"173\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">1<\/text><text x=\"133\" y=\"237\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">6<\/text><text x=\"222\" y=\"173\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">2<\/text><text x=\"243\" y=\"110\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">X<\/text><\/g><\/svg>"}, {"answer": "a", "text": "En la figura adjunta, el cuadrilátero ABCD es un cuadrado de lado 6 cm, dentro del cual hay dos semicircunferencias. Los segmentos AD y BC son los diámetros de las semicircunferencias. Además, las dos semicircunferencias se intersecan en un único punto P y la altura del triángulo ABP mide la mitad del lado del cuadrado. Según la información anterior, el área de la región sombreada en centímetros cuadrados corresponde a:", "choices": ["<span class=\"fraction\"><span>9π<\/span><span>2<\/span><\/span> − 9 cm²", "9 − <span class=\"fraction\"><span>9π<\/span><span>2<\/span><\/span> cm²", "36 − 9π cm²", "36 − <span class=\"fraction\"><span>9π<\/span><span>2<\/span><\/span> cm²"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 265 255\" width=\"265\" height=\"255\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><rect x=\"29\" y=\"20\" width=\"200\" height=\"200\" fill=\"none\"/><path d=\"M29 220L129 120A100 100 0 0 1 29 220Z M229 220L129 120A100 100 0 0 0 229 220Z\" fill=\"#acb5c1\"/><path d=\"M29 20A100 100 0 0 1 29 220 M229 20A100 100 0 0 0 229 220\" /><circle cx=\"129\" cy=\"120\" r=\"2.3\" fill=\"#202936\"/><text x=\"12\" y=\"236\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"234\" y=\"236\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><text x=\"233\" y=\"18\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">C<\/text><text x=\"13\" y=\"18\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">D<\/text><text x=\"138\" y=\"118\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">P<\/text><\/g><\/svg>"}, {"answer": "d", "text": "Se sabe que el producto de todos los divisores positivos de 36 puede expresarse como a · 36<sup>b<\/sup> , con 1 &lt; a &lt; 36. ¿Cuál es el valor de a · b?", "choices": ["6", "12", "18", "24"], "figure": ""}, {"answer": "a", "text": "Considere la siguiente figura donde AF = 7, BF = 2, BD = a, DC = 2a, EC = b y AE = 2b. ¿Cuál es, en unidades cuadradas, el área de la región sombreada?", "choices": ["7", "2ab", "ab", "<span class=\"fraction\"><span>7<\/span><span>2<\/span><\/span>"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 254 278\" width=\"254\" height=\"278\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M89 193H169L209 250L89 212Z\" fill=\"#acb5c1\"/><path d=\"M89 24L29 193L209 250Z M89 24V212 M29 193H169 M89 193h13v-13H89\" /><text x=\"82\" y=\"19\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"13\" y=\"197\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><text x=\"211\" y=\"263\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">C<\/text><text x=\"78\" y=\"226\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">D<\/text><text x=\"174\" y=\"188\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">E<\/text><text x=\"73\" y=\"187\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">F<\/text><text x=\"93\" y=\"116\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">7<\/text><text x=\"52\" y=\"188\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">2<\/text><text x=\"49\" y=\"211\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">a<\/text><text x=\"146\" y=\"243\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">2a<\/text><text x=\"196\" y=\"215\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">b<\/text><text x=\"140\" y=\"106\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">2b<\/text><\/g><\/svg>"}, {"answer": "b", "text": "Considere la siguiente sucesión de números 22−2, 222−22−2, 2222−222−22−2, 22222−2222−222−22−2, . . . ¿Cuál es el dígito de las unidades del número que está en la posición 2025?", "choices": ["0.", "2.", "4.", "6."], "figure": ""}], "II": [{"answer": "51200", "text": "Dieciséis estudiantes tienen una deuda con la señora de la soda del colegio. Todos ellos acordaron pagar la deuda en partes iguales, pero el día del pago, seis estudiantes solo pudieron pagar la mitad, por lo que los demás tuvieron que pagar un monto adicional de ₡960 cada uno. ¿Cuál era el monto total de la deuda?", "choices": [], "figure": ""}, {"answer": "24", "text": "En la fábrica Olcometa, hacen una limpieza general de las instalaciones por semestre. El semestre pasado participaron 120 empleados y duraron 14 horas, para este semestre partiparán 70 empleados. ¿cuántas horas durarán esas 70 personas haciendo la limpieza?", "choices": [], "figure": ""}, {"answer": "a", "text": "Considere el siguiente conjunto {1, 2, 3, 4, . . . , 48, 49, 50}. Al extraer un número del conjunto, la probabilidad de que el número seleccionado sea un número primo corresponde a", "choices": ["<span class=\"fraction\"><span>3<\/span><span>10<\/span><\/span>", "<span class=\"fraction\"><span>7<\/span><span>10<\/span><\/span>", "<span class=\"fraction\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fraction\"><span>1<\/span><span>2<\/span><\/span>"], "figure": ""}, {"answer": "50", "text": "En OLCOMA, las distancias se miden en «imos» (1 imo = 210 metros). La distancia desde la casa de Camila hasta su colegio es de 3,15 kilómetros. Si ella camina a una velocidad constante de 4,5 imos en 15 minutos, ¿cuántos minutos tardará en llegar de su casa al colegio?", "choices": [], "figure": ""}, {"answer": "b", "text": "Sean m y n dos números naturales de dos dígitos, con m > n. Si ambos números tienen los mismos dígitos, entonces", "choices": ["m + n y m −n son números primos.", "m + n y m −n son números compuestos.", "m + n es un número primo y m −n es un número compuesto.", "m −n es un número primo y m + n es un número compuesto."], "figure": ""}, {"answer": "c", "text": "Considere el número k ∈ ℕ y N = 10<sup>k<\/sup> + 10<sup>k−1<\/sup> + 10<sup>k−2<\/sup> + · · · + 10 + 1. Si se sabe que 3 es un divisor de N entonces con certeza se tiene que", "choices": ["k = n² con n ∈ ℕ.", "k = 3n con n ∈ ℕ.", "k = 3n −1 con n ∈ ℕ.", "k = 3n −2 con n ∈ ℕ."], "figure": ""}, {"answer": "b", "text": "Un grupo de 5 amigos está organizando su visita a la Comic Con que se llevará a cabo en Costa Rica. Necesitan escoger a 3 de las 5 personas para que los representen y vayan juntos al evento. ¿De cuántas maneras diferentes pueden elegir a esas 3 personas para asistir al evento?", "choices": ["60", "10", "30", "120"], "figure": ""}, {"answer": "c", "text": "Los veinticinco cuadrados de la figura que se presenta a continuación son congruentes. ¿Cuál de las siguientes afirmaciones es siempre verdadera para los ángulos α y β en la figura?", "choices": ["α = β", "α + β = 60°", "2α + β = 90°", "2β + α = 90°"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 274 267\" width=\"274\" height=\"267\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><rect x=\"14\" y=\"12\" width=\"240\" height=\"240\" fill=\"none\"/><path d=\"M62 12v240 M14 60h240\" stroke=\"#ccd4df\"/><path d=\"M110 12v240 M14 108h240\" stroke=\"#ccd4df\"/><path d=\"M158 12v240 M14 156h240\" stroke=\"#ccd4df\"/><path d=\"M206 12v240 M14 204h240\" stroke=\"#ccd4df\"/><path d=\"M14 252L158 12V252 M14 252L254 108 M48 252A34 34 0 0 0 43 234 M53 229A45 45 0 0 0 37 213\" /><text x=\"50\" y=\"246\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">α<\/text><text x=\"46\" y=\"216\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">β<\/text><\/g><\/svg>"}, {"answer": "36", "text": "Olcoman, el artesano del pueblo, está preparando decoraciones para el Festival del Sol. Tiene tres rollos de cinta de colores, con el mismo ancho y las siguientes longitudes:<br>• Rollo rojo: 72 centímetros<br>• Rollo azul: 108 centímetros<br>• Rollo verde: 180 centímetros<br><br>Debe cortar todos los rollos en tiras del mismo tamaño, sin que sobre ningún pedazo de cinta, y quiere que cada tira sea lo más larga posible para aprovechar los diseños. ¿Cuál es la longitud máxima en centímetros que puede tener cada tira?", "choices": [], "figure": ""}, {"answer": "165", "text": "Una empresa de seguridad desea encriptar una cerradura electrónica. Para ello escogerá el menor número de tres dígitos que cumpla las siguientes condiciones: Es divisible por 3 y por 5. Al dividirlo entre 4, el resto es 1. La suma de sus dígitos es un múltiplo de 4. Determine cuál debe ser el número.", "choices": [], "figure": ""}, {"answer": "b", "text": "En la figura se muestra un círculo inscrito en un cuadrado de lado L. Dentro de este círculo se encuentra inscrito un cuadrado más pequeño que también contiene otro círculo más pequeño inscrito. Nota: Una figura inscrita es una figura que está dibujada dentro de otra, de modo que toca los lados o bordes de la figura que la contiene sin salirse de ella. El área sombreada de la figura es igual a", "choices": ["(1 − <span class=\"fraction\"><span>π<\/span><span>8<\/span><\/span>)L²", "(<span class=\"fraction\"><span>3<\/span><span>2<\/span><\/span> − <span class=\"fraction\"><span>3π<\/span><span>8<\/span><\/span>)L²", "(<span class=\"fraction\"><span>4<\/span><span>3<\/span><\/span> − <span class=\"fraction\"><span>π<\/span><span>6<\/span><\/span>)L²", "(2 − <span class=\"fraction\"><span>π<\/span><span>2<\/span><\/span>)L²"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 266 245\" width=\"266\" height=\"245\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><rect x=\"49\" y=\"18\" width=\"190\" height=\"190\" fill=\"#acb5c1\"/><circle cx=\"144\" cy=\"113\" r=\"95\" fill=\"white\"/><rect x=\"76.8\" y=\"45.8\" width=\"134.4\" height=\"134.4\" fill=\"#acb5c1\"/><circle cx=\"144\" cy=\"113\" r=\"67.2\" fill=\"white\"/><path d=\"M26 18V208 M18 18h16 M18 208h16\" /><text x=\"8\" y=\"118\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">L<\/text><\/g><\/svg>"}, {"answer": "c", "text": "Considere el número N, con N = 95ba9 donde a es el dígito de las decenas y b es el dígito de las centenas. Sabemos que N es divisible por 11. La cantidad de valores distintos que puede tomar N corresponde a:", "choices": ["7", "8", "9", "10"], "figure": ""}, {"answer": "c", "text": "Considere la siguiente imagen: En la imagen anterior, AB ∥ED, DA ⊥AB, CD = CB. Se sabe que DF = 4 cm, el área del triángulo ABC es 8√<span class=\"radicand\">3<\/span> cm² y ED = <span class=\"fraction\"><span>8√<span class=\"radicand\">3<\/span><\/span><span>3<\/span><\/span> cm. El área del triángulo CDE es:", "choices": ["<span class=\"fraction\"><span>8√<span class=\"radicand\">3<\/span><\/span><span>3<\/span><\/span> cm²", "8√<span class=\"radicand\">3<\/span> cm²", "<span class=\"fraction\"><span>32√<span class=\"radicand\">3<\/span><\/span><span>3<\/span><\/span> cm²", "16√<span class=\"radicand\">3<\/span> cm²"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 268 275\" width=\"268\" height=\"275\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M15 20H250 M15 246H250 M134 14V252 M46 14L205 252 M75.93 58.8L134 20 M134 235h10v11 M129 84h10 M161 197l9 -6\" /><path d=\"M81.43 67.1l8.3 -5.5l-5.5 -8.3\" /><text x=\"36\" y=\"37\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">E<\/text><text x=\"60.93000000000001\" y=\"70.8\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">F<\/text><text x=\"139\" y=\"35\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">D<\/text><text x=\"140\" y=\"149.72\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">C<\/text><text x=\"119\" y=\"241\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"205\" y=\"241\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><\/g><\/svg>"}, {"answer": "c", "text": "Sean m, n y x números tales que x > 0 y m −n = 6x. Si (5x+3−m)(5x+3+m) = (5x−3+n)(5x−3−n), entonces una expresión equivalente a m es", "choices": ["6x", "12x", "3x + 5", "6x + 10"], "figure": ""}, {"answer": "85", "text": "En la siguiente figura se tiene que m∠ACB = 120°, m∠B = m∠AFE, m∠A = 40° y m∠EFD = 25°. La medida en grados del ángulo m∠BDF corresponde a ¿cuántos grados?", "choices": [], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 294 255\" width=\"294\" height=\"255\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M24 222L260 28L146 222 M24 222H260L156.16 113.36 M94.8 163.8L260 222\" /><circle cx=\"24\" cy=\"222\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"260\" cy=\"28\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"146\" cy=\"222\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"156.16\" cy=\"113.36\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"94.8\" cy=\"163.8\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"260\" cy=\"222\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"165.55\" cy=\"188.73\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"189.4\" cy=\"148.14\" r=\"2.3\" fill=\"#202936\"/><text x=\"8\" y=\"240\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"264\" y=\"27\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><text x=\"133\" y=\"242\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">C<\/text><text x=\"142\" y=\"107\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">D<\/text><text x=\"81\" y=\"160\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">E<\/text><text x=\"265\" y=\"238\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">F<\/text><text x=\"171.55\" y=\"204.73\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">G<\/text><text x=\"196.4\" y=\"162.14\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">H<\/text><\/g><\/svg>"}, {"answer": "30", "text": "Olcoman tiene seis gorras de Olcoma para regalar, durante los talleres que se dan para la I Eliminatoria. De estas seis gorras, 2 son azules (A), 2 negras (N) y 2 verdes (V). El día del entrenamiento, regaló rápidamente las seis gorras. Si se sabe que las dos gorras negras las regaló de forma consecutiva, es decir, una seguida de la otra, ¿De cuántas formas distintas pudo haber regalado las gorras? Por ejemplo, NNAAVV y ANNVVA son dos formas distintas que cumplen la condición.", "choices": [], "figure": ""}, {"answer": "c", "text": "En la siguiente figura, el cuadrilátero FEDC es un rectángulo y las regiones curvas corresponden a semicircunferencias. El punto de intersección de las dos semicircunferencias sombreadas y sus respectivos centros son colineales, ¿cuál es el área, en centímetros cuadrados, de la región sombreada?", "choices": ["36 cm²", "72 cm²", "108 cm²", "144 cm²"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 375 237\" width=\"375\" height=\"237\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><rect x=\"79\" y=\"85\" width=\"207.10835055998655\" height=\"128\" fill=\"none\"/><path d=\"M79 85A64 64 0 0 0 79 213 M286.10835055998655 85A64 64 0 0 1 286.10835055998655 213 M158.10835055998655 85A64 64 0 0 1 286.10835055998655 85\" /><path d=\"M79 85A39.554175279993274 39.554175279993274 0 0 0 158.10835055998655 85Z M79 213A103.55417527999327 103.55417527999327 0 0 1 286.10835055998655 213Z\" fill=\"#acb5c1\"/><text x=\"13\" y=\"155\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">36 cm²<\/text><text x=\"195\" y=\"63\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">36 cm²<\/text><text x=\"295\" y=\"155\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">36 cm²<\/text><text x=\"65\" y=\"81\" fill=\"#202936\" stroke=\"none\" font-famil los factores es", "choices": ["x −1", "x + 4", "x²", "x² + 4"], "figure": ""}, {"answer": "b", "text": "Luciano lanza una moneda al aire, y al caer anota si la parte de arriba de la moneda es escudo o corona. Luciano hace esto seis veces. Determine la probabilidad de que el número de coronas supere el número de escudos.", "choices": ["<span class=\"fraction\"><span>17<\/span><span>32<\/span><\/span>", "<span class=\"fraction\"><span>11<\/span><span>32<\/span><\/span>", "<span class=\"fraction\"><span>5<\/span><span>16<\/span><\/span>", "<span class=\"fraction\"><span>3<\/span><span>8<\/span><\/span>"], "figure": ""}, {"answer": "a", "text": "Sea ABC un triángulo tal que AB = √<span class=\"radicand\">3<\/span>, BC = 4 √<span class=\"radicand\">3<\/span> y m∠ABC = 120°. La medida de la altura del triángulo ABC sobre el lado AC corresponde a", "choices": ["<span class=\"fraction\"><span>2√<span class=\"radicand\">21<\/span><\/span><span>7<\/span><\/span>", "<span class=\"fraction\"><span>2√<span class=\"radicand\">21<\/span><\/span><span>3<\/span><\/span>", "<span class=\"fraction\"><span>18<\/span><span>√<span class=\"radicand\">21<\/span><\/span><\/span>", "<span class=\"fraction\"><span>9<\/span><span>√<span class=\"radicand\">21<\/span><\/span><\/span>"], "figure": ""}, {"answer": "c", "text": "Salomón juega con dos dados, uno tiene seis caras y el otro tiene doce caras. El dado de seis caras tiene escritos los números del 1 al 6 y el de doce caras tiene escritos los números del 1 al 12. Salomón tira los dos dados a la vez y suma los números de las caras que ven hacia arriba. ¿Cuál es la probabilidad de que la suma que obtiene sea un múltiplo de 3?", "choices": ["<span class=\"fraction\"><span>1<\/span><span>6<\/span><\/span>", "<span class=\"fraction\"><span>1<\/span><span>4<\/span><\/span>", "<span class=\"fraction\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fraction\"><span>1<\/span><span>2<\/span><\/span>"], "figure": ""}, {"answer": "c", "text": "En una caja se encuentran seis tarjetas en las que están escritos los números 1, 2, . . . , 6, de forma que cada uno de los seis números aparece en alguna de las tarjetas. Sin ver la caja, Ana toma una tarjeta y deja esa tarjeta afuera. Luego, sin ver la caja, Beto toma una tarjeta de las cinco restantes de la caja. Si a es el número de Ana y b el de Beto, entonces ellos construyen el polinomio cuadrático x² + ax + b. La probabilidad de que este polinomio tenga al menos una raíz real es igual a", "choices": ["<span class=\"fraction\"><span>1<\/span><span>2<\/span><\/span>", "<span class=\"fraction\"><span>7<\/span><span>10<\/span><\/span>", "<span class=\"fraction\"><span>8<\/span><span>15<\/span><\/span>", "<span class=\"fraction\"><span>19<\/span><span>30<\/span><\/span>"], "figure": ""}, {"answer": "6", "text": "Los números reales a y b son distintos y son las raíces del polinomio x² −4bx + 3a. Determine el valor de a −b.", "choices": [], "figure": ""}, {"answer": "a", "text": "Un pueblo tiene semanas de 9 días (a, b, . . . , h, i) y años con 10 meses (A, B, . . . , I, J). Los meses alternan entre 25 y 37 días: el mes A tiene 25, B tiene 37, C tiene 25, D tiene 37, y así sucesivamente. En cierto año, el día 1 del mes A fue un a. El siguiente mes para el cual el día 1 es un a corresponde al mes", "choices": ["F", "G", "H", "I"], "figure": ""}, {"answer": "a", "text": "En la fiesta de cumpleaños de Abelardo se dan cuenta que él y sus tres hijos tienen edades que son potencias perfectas (es decir, de la forma a<sup>b<\/sup> con a, b enteros y b ≥2); los tres hijos tienen edades distintas y Abelardo tiene menos de 100 años. Se sabe además que todos sus hijos son mayores de 18 años, nacieron cuando Abelardo tenía entre 25 y 40 años, y que la edad de Abelardo divide al producto de las edades de los tres hijos. Con base en la información anterior, se puede afirmar que:", "choices": ["No se puede determinar con certeza la edad del hijo menor.", "No se puede determinar con certeza la edad del hijo mayor.", "No se puede determinar con certeza la edad de Abelardo.", "Se puede determinar con certeza la edad de Abelardo y sus tres hijos."], "figure": ""}, {"answer": "c", "text": "Byron participa en un congreso en una ciudad que tiene el siguiente mapa, donde los puntos representan las esquinas y los segmentos las calles. Las direcciones norte y este se indican en la figura por N y E, respectivamente. Todos los días del congreso Byron tiene que ir desde su lugar de hospedaje (punto H) hasta la universidad (punto U). El punto P es una panadería muy famosa. Byron hace una lista de todos los posibles caminos desde el hospedaje a la universidad en los que solo camina al norte o al este (es decir, no camina al sur ni al oeste). Si Byron escoge aleatoriamente (con la misma probabilidad) entre los caminos de la lista, entonces la probabilidad de que pase por la panadería es", "choices": ["Menor que <span class=\"fraction\"><span>1<\/span><span>2<\/span><\/span>", "Igual a <span class=\"fraction\"><span>1<\/span><span>2<\/span><\/span>", "Igual a <span class=\"fraction\"><span>3<\/span><span>5<\/span><\/span>", "Mayor que <span class=\"fraction\"><span>3<\/span><span>5<\/span><\/span>"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 166\" width=\"320\" height=\"166\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M28 30H178 M28 80H178 M28 130H178 M28 30V130 M78 30V130 M128 30V130 M178 30V130 M232 82V40 M232 82H279\" /><circle cx=\"28\" cy=\"30\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"28\" cy=\"80\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"28\" cy=\"130\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"78\" cy=\"30\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"78\" cy=\"80\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"78\" cy=\"130\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"128\" cy=\"30\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"128\" cy=\"80\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"128\" cy=\"130\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"178\" cy=\"30\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"178\" cy=\"80\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"178\" cy=\"130\" r=\"2.3\" fill=\"#202936\"/><path d=\"M21 130l7 -7l7 7l-7 7Z M71 80l7 -7l7 7l-7 7Z M171 30l7 -7l7 7l-7 7Z M232 38l-4 8h8Z M281 82l-8 -4v8Z\" fill=\"#202936\"/><text x=\"11\" y=\"148\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">H<\/text><text x=\"84\" y=\"71\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">P<\/text><text x=\"184\" y=\"22\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">U<\/text><text x=\"227\" y=\"28\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">N<\/text><text x=\"289\" y=\"87\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">E<\/text><\/g><\/svg>"}, {"answer": "b", "text": "Un vendedor organiza en una fila los dispositivos tecnológicos que ofrece. Tiene un dron, dos computadoras portátiles (idénticas) y dos cámaras (idénticas), y no quiere que las cámaras queden juntas. ¿De cuántas maneras, visiblemente distintas, puede organizar los cinco objetos en la fila?", "choices": ["12", "18", "30", "120"], "figure": ""}, {"answer": "b", "text": "La cantidad de parejas de números enteros (x, y) que satisfacen la ecuación 4(x + y) = xy + 11 corresponde a", "choices": ["2", "4", "6", "8"], "figure": ""}, {"answer": "c", "text": "Sea mdc(a, b) el máximo divisor común de dos enteros positivos a y b. Sean m, n, p enteros positivos tales que mdc(m, n) = 120 y mdc(n, p) = 450. Un posible valor que puede tomar mdc(m, p) es", "choices": ["150", "180", "210", "240"], "figure": ""}, {"answer": "c", "text": "En la figura se muestra dos círculos tangentes entre sí y tangentes a las rectas OA y OB. Es conocido que los centros de los círculos y el punto de tangencia entre los círculos pertenecen a la bisectriz de ∠AOB, como se indica en la figura. El radio del círculo grande es igual a R y el del círculo pequeño es r. Si m∠AOB = 60°(la figura no está hecha a escala), entonces se cumple que", "choices": ["R = r√<span class=\"radicand\">3<\/span>", "R = 2r", "R = 3r", "R = 2r√<span class=\"radicand\">3<\/span>"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 315 220\" width=\"315\" height=\"220\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M12 182H290L194 15\" /><path d=\"M90 66L290 182\" stroke-dasharray=\"6 5\"/><circle cx=\"193.0051547761429\" cy=\"126\" r=\"56\" fill=\"none\"/><circle cx=\"257.66838492538096\" cy=\"163.33333333333334\" r=\"18.666666666666668\" fill=\"none\"/><circle cx=\"193.0051547761429\" cy=\"126\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"257.66838492538096\" cy=\"163.33333333333334\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"241.50257738807144\" cy=\"98\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"241.50257738807144\" cy=\"154\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"193.0051547761429\" cy=\"182\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"290\" cy=\"182\" r=\"2.3\" fill=\"#202936\"/><text x=\"186.0051547761429\" y=\"204\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"248.50257738807144\" y=\"90\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><text x=\"295\" y=\"199\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">O<\/text><\/g><\/svg>"}, {"answer": "12", "text": "Determine la cantidad de números de seis cifras que son divisibles por 22 y cuya suma de sus dígitos es igual a 50.", "choices": [], "figure": ""}, {"answer": "d", "text": "En la siguiente figura, los □ABCD y □CEFG son cuadrados, cuyos lados miden √<span class=\"radicand\">3<\/span> cm. Entonces el área sombreada es igual a", "choices": ["2 + √<span class=\"radicand\">3<\/span>", "<span class=\"fraction\"><span>3√<span class=\"radicand\">3< ales es una solución si cumple el sistema de ecuaciones <span class=\"system\">xy + 1 = Ay<br>yz + 1 = Az<br>zx + 1 = Ax<\/span> Considere las siguientes afirmaciones:<br>(I) Si el sistema tiene al menos una solución, entonces |A| ≥ 2.<br>(II) Hay números reales A para los cuales el sistema tiene infinitas soluciones.<br>De las afirmaciones anteriores, ¿cuáles son verdaderas?", "choices": ["Ninguna", "Solo la I", "Solo la II", "Ambas"], "figure": ""}, {"answer": "648", "text": "Isabel tiene un entero positivo favorito n. Ella nota que el número 3n tiene 4 divisores positivos más que n y que el número 4n tiene 10 divisores positivos más que n. Determine el número de Isabel.", "choices": [], "figure": ""}, {"answer": "d", "text": "Ana, Berta y Carla hacen una caminata de una forma muy particular. Como se indica en la figura, ir al norte es desplazarse en el sentido del semieje positivo y, e ir al este es desplazarse en el sentido del semieje positivo x. Empezando desde el origen O, ellas caminan juntas de la siguiente manera: 100m al este, 200m al norte, 300m al este, 400m al norte, 500m al este, 600m al norte, 700m al este, 800m al norte y 900m al este. Ana se detiene en este punto. Berta y Carla caminan 1000m al norte, donde Berta se detiene; finalmente, Carla camina 1100m al este y se detiene. Sean A, B, C las posiciones finales de Ana, Berta y Carla, respectivamente, y sean α = m∠AOX, β = m∠BOX y γ = m∠COX (en la figura se muestra ∠POX). Considere las siguientes afirmaciones:<br>(I) α &lt; γ,<br>(II) β + γ = 90°.<br>De las afirmaciones anteriores, ¿cuáles son verdaderas?", "choices": ["Ninguna", "Solo la I", "Solo la II", "Ambas"], "figure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 235\" width=\"260\" height=\"235\"><g stroke=\"#202936\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M35 12v192\" stroke=\"#d0d7de\"/><path d=\"M75 12v192\" stroke=\"#d0d7de\"/><path d=\"M115 12v192\" stroke=\"#d0d7de\"/><path d=\"M155 12v192 ejoin=\"round\"><path d=\"M30 251L164 29L337 251Z M97.0 140.0L337 251 M164 29L132.33333333333331 251 M30 251L312.2857142857143 219.28571428571428\" /><circle cx=\"30\" cy=\"251\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"337\" cy=\"251\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"164\" cy=\"29\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"97.0\" cy=\"140.0\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"132.33333333333331\" cy=\"251\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"312.2857142857143\" cy=\"219.28571428571428\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"134.0\" cy=\"239.32\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"145.0\" cy=\"162.2\" r=\"2.3\" fill=\"#202936\"/><circle cx=\"277.0\" cy=\"223.25\" r=\"2.3\" fill=\"#202936\"/><text x=\"18\" y=\"269\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">A<\/text><text x=\"339\" y=\"267\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">B<\/text><text x=\"167\" y=\"23\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">C<\/text><text x=\"84\" y=\"132\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">D<\/text><text x=\"127\" y=\"270\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">E<\/text><text x=\"319\" y=\"214\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">F<\/text><text x=\"117.0\" y=\"234.32\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">M<\/text><text x=\"152.0\" y=\"163.2\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">N<\/text><text x=\"283.0\" y=\"215.25\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">P<\/text><text x=\"117\" y=\"245\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">a<\/text><text x=\"307\" y=\"238\" fill=\"#202936\" stroke=\"none\" font-family=\"system-ui\" font-size=\"15\">b<\/text><text x=\"118\" y=\"142\" fill=\"#202 <script>
const exams = JSON.parse(document.getElementById('data').textContent);
const requested = new URLSearchParams(location.search).get('nivel');
const level = ['I', 'II', 'III'].includes(requested) ? requested : 'I';
const items = exams[level];
const get = id => document.getElementById(id);
const levelLink = [...get('levels').querySelectorAll('a')].find(link => link.search === '?nivel=' + level);
levelLink.setAttribute('aria-current', 'page');
get('level-title').textContent = levelLink.textContent;
const storageKey = 'olcoma-2025:' + level;
const duration = 3 * 60 * 60 * 1000;
function read() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (Number.isFinite(saved?.deadline) && saved.answers?.length === items.length) return saved;
  } catch {}
  return null;
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(attempt)); } catch {}
}
let attempt = read();
let question = 0;
let timer;
const buttons = items.map((_, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = String(index + 1);
  button.addEventListener('click', () => show(index));
  get('jump').append(button);
  return button;
});
function progress() {
  const count = attempt.answers.filter(Boolean).length;
  get('progress').textContent = count + ' de ' + items.length + ' respondidas';
  get('countTop').textContent = count + '/' + items.length;
  get('question-status').textContent = attempt.answers[question] ? 'Respondida' : 'Sin responder';
  buttons.forEach((button, index) => {
    button.className = ['qjump', attempt.answers[index] ? 'answered' : 'unanswered', index === question ? 'current' : ''].join(' ');
    button.setAttribute('aria-current', index === question ? 'step' : 'false');
    button.setAttribute('aria-label', 'Pregunta ' + (index + 1) + (attempt.answers[index] ? ', respondida' : ', sin responder'));
  });
}
function show(index, focus = true) {
  question = index;
  const item = items[index];
  const stem = document.createElement('div');
  stem.className = 'qtext';
  stem.innerHTML = item.text;
  if (item.figure) {
    const drawing = document.createElement('figure');
    drawing.className = 'qfigure';
    drawing.setAttribute('aria-label', 'Figura de la pregunta ' + (index + 1));
    drawing.innerHTML = item.figure;
    stem.append(drawing);
  }
  const field = document.createElement('fieldset');
  const legend = document.createElement('legend');
  const numeric = /^\d+$/.test(item.answer);
  legend.textContent = numeric ? 'Respuesta numérica' : 'Selecciona una opción';
  field.append(legend);
  function record(value) {
    if (Date.now() >= attempt.deadline) return tick();
    attempt.answers[index] = value;
    save();
    progress();
  }
  if (numeric) {
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.setAttribute('aria-label', legend.textContent);
    input.value = attempt.answers[index];
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9]/g, '');
      record(input.value);
    });
    field.append(input);
  } else {
    const choices = document.createElement('div');
    choices.className = 'choices';
    for (const [optionIndex, option] of [...'abcd'].entries()) {
      const label = document.createElement('label');
      label.className = 'choice';
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'answer';
      input.value = option;
      input.checked = attempt.answers[index] === option;
      input.addEventListener('change', () => record(option));
      const letter = document.createElement('span');
      letter.className = 'optletter';
      letter.textContent = option.toUpperCase() + '.';
      const optionText = document.createElement('span');
      optionText.innerHTML = item.choices[optionIndex];
      label.append(input, letter, optionText);
      choices.append(label);
    }
    field.append(choices);
  }
  get('question-title').textContent = 'Pregunta ' + (index + 1) + ' de ' + items.length;
  get('question').replaceChildren(stem, field);
  get('previous').disabled = index === 0;
  get('next').disabled = index === items.length - 1;
  progress();
  if (focus) get('question-title').focus();
}
function tick() {
  const seconds = Math.max(0, Math.ceil((attempt.deadline - Date.now()) / 1000));
  get('clock').textContent = [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60].map(value => String(value).padStart(2, '0')).join(':');
  if (seconds === 0) finish(true);
}
function finish(expired) {
  clearInterval(timer);
  if (get('confirm').open) get('confirm').close();
  if (!attempt.finished) {
    attempt.finished = true;
    attempt.expired = expired;
    save();
  }
  get('startView').hidden = get('examView').hidden = true;
  get('results').hidden = false;
  let correct = 0;
  let incorrect = 0;
  const review = get('review');
  review.replaceChildren();
  items.forEach(({answer}, index) => {
    const entered = attempt.answers[index];
    const matches = entered === answer;
    if (matches) correct++;
    else if (entered) incorrect++;
    const row = document.createElement('div');
    row.className = 'review-row';
    const title = document.createElement('b');
    title.textContent = 'Ítem ' + (index + 1);
    const response = document.createElement('span');
    response.className = matches ? 'good' : entered ? 'bad' : 'status';
    response.textContent = entered ? 'Tu respuesta: ' + entered.toUpperCase() : 'Sin responder';
    const solution = document.createElement('span');
    solution.textContent = 'Correcta: ' + answer.toUpperCase();
    row.append(title, response, solution);
    review.append(row);
  });
  get('score').textContent = correct + '/' + items.length;
  get('percent').textContent = (attempt.expired ? 'El tiempo terminó. ' : '') + Math.round(correct * 100 / items.length) + ' % de aciertos';
  get('correct').textContent = correct;
  get('incorrect').textContent = incorrect;
  get('blank').textContent = items.length - correct - incorrect;
  get('countTop').textContent = (correct + incorrect) + '/' + items.length;
  get('result-title').focus();
}
function begin() {
  if (!attempt) {
    attempt = {deadline: Date.now() + duration, answers: items.map(() => '')};
    save();
  }
  get('startView').hidden = true;
  get('results').hidden = true;
  get('examView').hidden = false;
  show(0);
  timer = setInterval(tick, 250);
  tick();
}
get('start').addEventListener('click', begin);
get('restart').addEventListener('click', () => {
  attempt = null;
  begin();
});
get('previous').addEventListener('click', () => show(question - 1));
get('next').addEventListener('click', () => show(question + 1));
get('finish').addEventListener('click', () => {
  get('confirm-text').textContent = get('progress').textContent + '. Al finalizar verás tu resultado.';
  get('confirm').showModal();
});
get('confirm').addEventListener('close', () => {
  if (get('confirm').returnValue === 'finish' && !attempt.finished) finish(Date.now() >= attempt.deadline);
  get('confirm').returnValue = '';
});
if (attempt?.finished) finish(attempt.expired);
else if (attempt) begin();
</script>
